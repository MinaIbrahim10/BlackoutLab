name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[test]'
      - run: python -m pytest -q
      - run: python -m blackout benchmark --mode runbook --trials 2 --output reference.json
      - uses: actions/upload-artifact@v4
        with:
          name: runbook-reference-python-${{ matrix.python }}
          path: reference.json
  frontend-and-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check blackout/static/app.js
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait
      - name: Exercise distributed control API
        run: |
          python3 - <<'PY'
          import json,time,urllib.request
          base='http://127.0.0.1:8080'
          for scenario in ['orphaned-payment','duplicate-reservation','payments-outage']:
              req=urllib.request.Request(base+'/api/runs',data=json.dumps({'scenario':scenario,'mode':'runbook'}).encode(),headers={'Content-Type':'application/json'})
              run=json.load(urllib.request.urlopen(req))['id']
              for _ in range(100):
                  result=json.load(urllib.request.urlopen(base+'/api/runs/'+run))
                  if result['status'] in ['recovered','unresolved','failed']: break
                  time.sleep(.2)
              assert result['status']=='recovered',result
              assert result['report']['after']['verification']['stock']==17,result
          PY
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down
