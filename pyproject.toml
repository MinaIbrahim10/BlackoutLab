[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blackout-lab"
version = "0.1.0"
description = "A reproducible commerce incident-response laboratory with local Gemma agents"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Mina Ibrahim"}]
license = {text = "MIT"}
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "opentelemetry-sdk>=1.28,<2", "opentelemetry-exporter-otlp-proto-http>=1.28,<2", "pydantic>=2.9,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
blackout = "blackout.__main__:main"

[tool.setuptools.package-data]
blackout = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
